    <style>
      html,
      body {
        font-family: var(
          --app-font-family,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif
        );
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader {
          background: #0a0a0a;
        }
      }
      html[data-theme-preset="cream"][data-theme="light"] #boot-loader {
        background: #faf9f5;
      }
      html[data-theme-preset="cream"][data-theme="dark"] #boot-loader {
        background: #141413;
      }
      html[data-theme-preset="cyberpunk"][data-theme="light"] #boot-loader {
        background: #f0f0f2;
      }
      html[data-theme-preset="cyberpunk"][data-theme="dark"] #boot-loader {
        background: #0a0a0f;
      }
      html[data-theme-preset="notion"][data-theme="light"] #boot-loader {
        background: #ffffff;
      }
      html[data-theme-preset="notion"][data-theme="dark"] #boot-loader {
        background: #191919;
      }
      .boot-logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .boot-logo-svg {
        filter: drop-shadow(0 0 6px rgba(125, 211, 252, 0.45));
        animation: boot-glow 2.4s ease-in-out infinite alternate;
      }
      @keyframes boot-glow {
        from {
          filter: drop-shadow(0 0 4px rgba(125, 211, 252, 0.3));
        }
        to {
          filter: drop-shadow(0 0 10px rgba(125, 211, 252, 0.6));
        }
      }
      .boot-shimmer-bar {
        animation: boot-shimmer 2.4s ease-in-out infinite;
      }
      @keyframes boot-shimmer {
        0% {
          transform: translateX(-80px);
        }
        100% {
          transform: translateX(235px);
        }
      }
      .boot-progress-track {
        width: 120px;
        height: 2px;
        margin-top: 18px;
        background: rgba(128, 128, 128, 0.15);
        border-radius: 1px;
        overflow: hidden;
      }
      .boot-progress-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #9bd8ff, transparent);
        border-radius: 1px;
        animation: boot-progress 1.6s ease-in-out infinite;
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .boot-slogan {
        margin-top: 14px;
        max-width: 320px;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(128, 128, 128, 0.65);
        text-align: center;
        letter-spacing: 0.01em;
        animation: boot-slogan-fade 0.1s ease-out 0.1s both;
      }
      @keyframes boot-slogan-fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo-svg,
        .boot-shimmer-bar,
        .boot-progress-bar,
        .boot-slogan {
          animation: none;
        }
      }
    </style>
    <!-- 首帧字体走 bootFont 模块：页面 CSP 为 script-src 'self' blob:，内联脚本会被拒绝执行。 -->
