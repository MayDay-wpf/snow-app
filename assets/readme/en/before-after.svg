<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">From moving context around to an agent doing the work</title>
  <desc id="d">Conceptual comparison: moving context between scattered tools versus one coding agent reading code, editing files and running commands in a single window.</desc>
  <rect width="1200" height="430" rx="18" fill="#FFFFFF"/>  <text x="56" y="66" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="19" letter-spacing="1.6" fill="#9CA3AF">BEFORE · you move between tools</text>  <rect x="56" y="92" width="440" height="56" rx="12" fill="#F3F4F6"/><g transform="translate(76 106) scale(1.1667)" fill="none" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2" /> <path d="M11 13h4" /> <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /></g>  <text x="124" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#6B7280">Terminal app</text>  <rect x="56" y="162" width="440" height="56" rx="12" fill="#F3F4F6"/><g transform="translate(76 176) scale(1.1667)" fill="none" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" /> <rect width="20" height="8" x="2" y="14" rx="2" ry="2" /> <line x1="6" x2="6.01" y1="6" y2="6" /> <line x1="6" x2="6.01" y1="18" y2="18" /></g>  <text x="124" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#6B7280">SSH client</text>  <rect x="56" y="232" width="440" height="56" rx="12" fill="#F3F4F6"/><g transform="translate(76 246) scale(1.1667)" fill="none" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3" /> <circle cx="18" cy="6" r="3" /> <circle cx="6" cy="18" r="3" /></g>  <text x="124" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#6B7280">Git GUI</text>  <rect x="56" y="302" width="440" height="56" rx="12" fill="#F3F4F6"/><g transform="translate(76 316) scale(1.1667)" fill="none" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /> <path d="M2 12h20" /></g>  <text x="124" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#6B7280">Browser</text>  <rect x="56" y="372" width="440" height="56" rx="12" fill="#F3F4F6"/><g transform="translate(76 386) scale(1.1667)" fill="none" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" /> <path d="M7 11h10" /> <path d="M7 15h6" /> <path d="M7 7h8" /></g>  <text x="124" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#6B7280">Web AI chat</text>  <path d="M544 215 H636" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>  <path d="M622 203 L638 215 L622 227" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>  <text x="676" y="66" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="19" letter-spacing="1.6" fill="#3B82F6">AFTER · the agent stays in one window</text>  <rect x="676" y="92" width="468" height="294" rx="14" fill="#F5F7F9" stroke="#E5E7EB"/>  <line x1="860" y1="92" x2="860" y2="386" stroke="#E5E7EB"/>  <line x1="1020" y1="92" x2="1020" y2="386" stroke="#E5E7EB"/>  <rect x="676" y="92" width="184" height="294" rx="14" fill="#73AFD155"/>  <text x="694" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0B1220">Coding session</text>  <text x="876" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0B1220">Files · shell · Git</