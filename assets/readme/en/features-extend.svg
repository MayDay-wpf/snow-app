<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Extend the agent and the content</title>
  <desc id="d">Eight extension and content capabilities: plugins and market, user scripts, custom commands, request proxy, hooks, repo wiki, drawing studio, image library.</desc>
