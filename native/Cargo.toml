[package]
name = "snow_native"
version = "0.1.22"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "snow-agent"
path = "src/bin/snow-agent.rs"

[dependencies]
chrono = "0.4.38"
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
dirs-next = "2.0.0"
futures = "0.3.31"
napi = { version = "3.2.4", default-features = false, features = ["napi4", "async"] }
napi-derive = "3.2.4"
reqwest = { version = "0.12.5", features = ["blocking", "json", "stream", "multipart", "gzip", "brotli", "deflate"] }
flate2 = "1"
libc = "0.2"
tar = "0.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9"
tokio = { version = "1.39.2", features = ["io-util", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
notify = "6"
regex = "1"
similar = "2"
tiktoken-rs = "0.6"
uuid = { version = "1", features = ["v4"] }
calamine = "0.36"
chardetng = "0.1"
csv = "1.4"
encoding_rs = "0.8"
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
oxc = { version = "0.82", features = ["semantic", "ast_visit"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-json = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-lua = "0.5"

# Browser credential import: Chrome/Edge/Chromium (PBKDF2 + AES-128-CBC,
# DPAPI + AES-256-GCM, App-Bound v20: SYSTEM DPAPI + AES-256-GCM /
# ChaCha20-Poly1305 / CNG) and Firefox (SHA1 20-round + 3DES-CBC). Pure-Rust
# crypto crates so the native module stays self-contained.
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
chacha20poly1305 = "0.10"
cipher = "0.4"
des = "0.8"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

# Official MCP Rust SDK (2026-07-28 spec). Replaces hand-rolled JSON-RPC client.
rmcp = { version = "3.0.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# The `http` crate provides HeaderName / HeaderValue types used by rmcp's
# StreamableHttpClientTransportConfig::custom_headers API. It is already pulled
# in transitively by rmcp + reqwest, but we declare it explicitly so we can
# reference it directly in our code.
http = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[build-dependencies]
napi-build = "2.2.3"

# -- dev: reduce debug info (MSVC debug generation is very slow) --
[profile.dev]
debug = "line-tables-only"
incremental = true

# Dependencies are compiled once and cached; skip debug info + slight optimisation
[profile.dev.package."*"]
debug = false
opt-level = 1

# -- release: keep codegen-units high for parallel LLVM, thin LTO for link speed --
[profile.release]
lto = "thin"
codegen-units = 4
