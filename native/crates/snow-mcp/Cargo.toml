[package]
name = "snow-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snow-support = { path = "../snow-support" }
snow-process = { path = "../snow-process" }
snow-runtime = { path = "../snow-runtime" }
snow-text = { path = "../snow-text" }
snow-storage-core = { path = "../snow-storage-core" }
snow-net = { path = "../snow-net" }
snow-storage = { path = "../snow-storage" }
snow-ai = { path = "../snow-ai" }
snow-tools = { path = "../snow-tools" }
snow-providers = { path = "../snow-providers" }
snow-team = { path = "../snow-team" }
snow-plugin = { path = "../snow-plugin" }
snow-hooks = { path = "../snow-hooks" }
snow-retrieval = { path = "../snow-retrieval" }
snow-storage-services = { path = "../snow-storage-services" }
snow-remote = { path = "../snow-remote" }
chrono = "0.4.38"
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
dirs-next = "2.0.0"
futures = "0.3.31"
napi = { version = "3.2.4", default-features = false, features = ["napi4", "async"] }
napi-derive = "3.2.4"
ctor = "1"
reqwest = { version = "0.12.5", features = ["blocking", "json", "stream", "multipart", "gzip", "brotli", "deflate"] }
flate2 = "1"
libc = "0.2"
tar = "0.4"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9"
tokio = { version = "1.39.2", features = ["io-util", "process", "rt", "rt-multi-thread", "sync", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
axum = { version = "0.8", features = ["ws"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
url = "2"
percent-encoding = "2"
getrandom = "0.2"
notify = "6"
regex = "1"
similar = "2"
tiktoken-rs = "0.6"
uuid = { version = "1", features = ["v4"] }
calamine = "0.36"
chardetng = "0.1"
csv = "1.4"
encoding_rs = "0.8"
rust_xlsxwriter = "0.96"
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
enigo = "0.6"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
cipher = "0.4"
des = "0.8"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
rmcp = { version = "3.0.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
rmcp-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = [
    "json",
    "stream",
] }
async-lsp = { version = "0.2", default-features = false, features = ["tokio", "stdio", "omni-trait"] }
lsp-types = { version = "0.95" }
http = "1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"

[target.'cfg(windows)'.dependencies]
chacha20poly1305 = "0.10"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"
