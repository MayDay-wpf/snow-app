[package]
name = "snow-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snow-support = { path = "../snow-support" }
snow-storage-core = { path = "../snow-storage-core" }
snow-storage = { path = "../snow-storage" }
snow-ai = { path = "../snow-ai" }
snow-net = { path = "../snow-net" }
snow-tools = { path = "../snow-tools" }
snow-runtime = { path = "../snow-runtime" }
snow-text = { path = "../snow-text" }
snow-process = { path = "../snow-process" }
napi.workspace = true
napi-derive = "3.2.4"
tokio.workspace = true
serde = { version = "1.0.204", features = ["derive"] }
serde_json.workspace = true
futures.workspace = true
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.12.5", features = ["json", "stream"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
blake3 = "1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
