name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: ""
        required: true
        type: string
      release_notes:
        description: ""
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            rust_targets: x86_64-pc-windows-msvc
            build_args: "--win nsis portable"
          - os: macos-latest
            platform: darwin
            arch: arm64
            rust_targets: aarch64-apple-darwin
            build_args: "--mac dmg zip --arm64"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            rust_targets: x86_64-apple-darwin
            build_args: "--mac dmg zip --x64"
          - os: ubuntu-latest
            platform: linux
            rust_targets: x86_64-unknown-linux-gnu
            build_args: "--linux AppImage deb"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/

      - name: Retry npm install on network failure
        if: failure()
        run: npm ci
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/

      - name: Build TypeScript + Vite + Rust native
        env:
          NATIVE_BUILD_ARCH: ${{ matrix.arch }}
          SNOW_AGENT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SNOW_AGENT_RELEASE_KEY_ID: snow-agent-ed25519-2026
          SNOW_AGENT_RELEASE_SIGNING_KEY: ${{ secrets.SNOW_AGENT_RELEASE_SIGNING_KEY }}
          SNOW_AGENT_REQUIRE_RELEASE_SIGNING: "1"
        run: npm run build

      - name: Build electron packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Rename arm64 update yml to avoid collision
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        run: |
          if [ -f release/latest-mac.yml ]; then
            mv release/latest-mac.yml release/latest-mac-arm64.yml
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/snow-agent-*
          if-no-files-found: warn

  snow-agent:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            cargo_subcommand: zigbuild
          - os: ubuntu-latest
            target: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            cargo_subcommand: zigbuild
          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
            cargo_subcommand: build
          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
            cargo_subcommand: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Zig and cargo-zigbuild
        if: matrix.cargo_subcommand == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@v2
        if: matrix.cargo_subcommand == 'zigbuild'
        with:
          tool: cargo-zigbuild

      - name: Build signed static Snow Agent
        env:
          SNOW_AGENT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SNOW_AGENT_RELEASE_KEY_ID: snow-agent-ed25519-2026
          SNOW_AGENT_RELEASE_SIGNING_KEY: ${{ secrets.SNOW_AGENT_RELEASE_SIGNING_KEY }}
          SNOW_AGENT_CARGO_SUBCOMMAND: ${{ matrix.cargo_subcommand }}
        run: npm run build:snow-agent-release -- ${{ matrix.target }}

      - name: Verify signed Snow Agent release asset
        run: npm run verify:snow-agent-release

      - name: Upload Snow Agent release asset
        uses: actions/upload-artifact@v4
        with:
          name: snow-agent-${{ matrix.target }}
          path: |
            release/snow-agent-${{ matrix.target }}
            release/snow-agent-${{ matrix.target }}.json
          if-no-files-found: error

      - name: Upload Snow Agent trust root
        if: matrix.target == 'linux-x64-musl'
        uses: actions/upload-artifact@v4
        with:
          name: snow-agent-trust
          path: resources/snow-agent/trust.json
          if-no-files-found: error

  publish:
    needs: [build, snow-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Verify all signed Snow Agent release assets
        env:
          SNOW_AGENT_REQUIRED_TARGETS: linux-x64-musl,linux-arm64-musl,darwin-x64,darwin-arm64
        run: |
          mkdir -p resources/snow-agent
          cp release/trust.json resources/snow-agent/trust.json
          npm run verify:snow-agent-release

      - name: Merge macOS update yml (arm64 + x64)
        run: node scripts/merge-mac-yml.cjs

      # 生成无签名更新清单 latest-mac.json（版本号 + 各架构 zip 的 SHA-256）
      - name: Generate latest-mac.json
        run: node scripts/generate-latest-json.cjs ${{ inputs.tag || github.ref_name }}

      - name: Prepare release notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            echo "$RELEASE_NOTES_INPUT" > release_body.md
            echo "Using manually provided release notes"
          else
            node scripts/extract-release-notes.cjs "$RELEASE_TAG"
            echo "Extracted release notes from RELEASE_NOTES.md"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/latest-mac.json
            release/snow-agent-*
